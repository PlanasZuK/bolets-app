<!doctype html>
<html lang="ca">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,maximum-scale=1">
<meta name="theme-color" content="#F5F5F7" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)">
<title>Radar de bolets</title>
<link rel="manifest" href="app/manifest.webmanifest"><link rel="icon" href="app/icon.svg"><link rel="apple-touch-icon" href="app/icon.svg">
<meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="default">

<script src="https://unpkg.com/maplibre-gl@5.24.0/dist/maplibre-gl.js"></script>

<style>
/* ═══ tokens (docs/DISSENY_UI.md) */
:root{--bg:#F5F5F7;--paper:#FFFFFF;--ink:#1D1D1F;--mute:#86868B;--hair:rgba(0,0,0,.08);--fill:rgba(118,118,128,.1);
 --g9:#1D1D1F;--g7:#E8590C;--g4:#FFA94D;--g2:#FFF1E6;--on:#FFFFFF;
 --shadow:0 20px 50px rgba(0,0,0,.12),0 1px 4px rgba(0,0,0,.06);--r:22px;--ease:cubic-bezier(.22,.8,.2,1);
 --font:-apple-system,BlinkMacSystemFont,"SF Pro Text","SF Pro Display","Segoe UI Variable Text","Segoe UI",system-ui,sans-serif;--sw:380px}
@media (prefers-color-scheme:dark){:root{--bg:#000000;--paper:#1C1C1E;--ink:#F5F5F7;--mute:#98989D;--hair:rgba(255,255,255,.1);--fill:rgba(118,118,128,.24);
 --g9:#F5F5F7;--g7:#FF7A2F;--g4:#B85A1E;--g2:#3A2416;--on:#000000;--shadow:0 20px 50px rgba(0,0,0,.6)}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;margin:0}
html,body{height:100%;overflow:hidden;background:var(--bg);color:var(--ink);font:400 15px/20px var(--font);-webkit-font-smoothing:antialiased;letter-spacing:-.2px}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer;padding:0}
input{font:inherit;color:inherit}
svg.i{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round;flex:none}
#map{position:fixed;inset:0}
.t28{font-size:28px;line-height:34px;font-weight:700;letter-spacing:-.6px}.t17{font-size:17px;line-height:22px;font-weight:600;letter-spacing:-.4px}
.t12{font-size:13px;line-height:18px;color:var(--mute)}.m{color:var(--mute)}
/* ═══ full únic */
.sheet{position:fixed;z-index:10;left:16px;top:16px;bottom:16px;width:var(--sw);background:var(--paper);border-radius:var(--r);box-shadow:var(--shadow);
 display:flex;flex-direction:column;overflow:hidden;transition:height .32s var(--ease)}
.handle{display:none}
.screens{position:relative;flex:1;overflow:hidden}
.scr{position:absolute;inset:0;display:flex;flex-direction:column;opacity:0;transform:translateX(24px);pointer-events:none;transition:opacity .24s var(--ease),transform .24s var(--ease)}
.scr.on{opacity:1;transform:none;pointer-events:auto}.scr.back{transform:translateX(-24px)}
.body{flex:1;overflow:auto;padding:0 24px;scrollbar-width:none}.body::-webkit-scrollbar{display:none}
.foot{padding:16px 24px 24px}
.top{display:flex;align-items:center;justify-content:space-between;height:64px;padding:0 24px;flex:none}
.word{font-size:20px;font-weight:700;letter-spacing:-.6px}.word b{color:var(--g7)}
.ib{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;color:var(--mute)}.ib:hover{background:var(--fill);color:var(--ink)}
.back{display:flex;align-items:center;gap:4px;height:40px;padding:0 8px 0 4px;margin-left:-8px;border-radius:12px;color:var(--mute);font-weight:500}.back:hover{background:var(--fill);color:var(--ink)}
.demo{font-size:12px;color:var(--g7);display:none}
/* cerca */
.search{display:flex;align-items:center;gap:8px;height:48px;padding:0 16px;border-radius:16px;background:var(--fill);position:relative}
.search input{flex:1;border:0;background:none;outline:none;font-size:15px}.search input::placeholder{color:var(--mute)}
.sug{position:absolute;left:0;right:0;top:56px;background:var(--paper);border-radius:16px;box-shadow:var(--shadow);padding:8px;display:none;z-index:5;max-height:320px;overflow:auto}
.sug div{display:flex;justify-content:space-between;align-items:center;height:44px;padding:0 12px;border-radius:12px;cursor:pointer}.sug div:hover{background:var(--fill)}
/* dies */
.days{display:flex;gap:8px;overflow-x:auto;padding:16px 24px 0;margin:0 -24px;scrollbar-width:none;scroll-snap-type:x proximity;-webkit-mask-image:linear-gradient(90deg,transparent,#000 24px,#000 calc(100% - 24px),transparent);mask-image:linear-gradient(90deg,transparent,#000 24px,#000 calc(100% - 24px),transparent)}.days::-webkit-scrollbar{display:none}
.day{flex:none;height:36px;padding:0 14px;border-radius:12px;background:var(--fill);font-weight:500;white-space:nowrap;scroll-snap-align:center;transition:background .2s,color .2s;position:relative}
.day.on{background:var(--g9);color:var(--on)}.day.past{color:var(--mute)}.day.on.past{color:var(--on)}
.day.bd::after{content:"";position:absolute;top:6px;right:6px;width:6px;height:6px;border-radius:50%;background:var(--g7)}.day.on.bd::after{background:var(--on)}
/* fila de filtre + llegenda */
.filter{display:flex;align-items:center;justify-content:space-between;margin-top:16px;height:40px}
.pill{display:inline-flex;align-items:center;gap:6px;height:36px;padding:0 12px 0 14px;border-radius:12px;background:var(--fill);font-weight:500}
.legend{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--mute)}
.legend i{width:56px;height:6px;border-radius:3px}
.fams{display:flex;flex-wrap:wrap;gap:6px 14px;margin-top:12px;font-size:13px;color:var(--mute)}.fams span{display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.fams i,.cd{width:10px;height:10px;border-radius:50%;flex:none;display:inline-block}
.grp{display:flex;align-items:center;gap:10px;margin:24px 0 4px;font-size:13px;font-weight:600;color:var(--mute);text-transform:uppercase;letter-spacing:.4px}
/* llistes */
.sec{display:flex;justify-content:space-between;align-items:baseline;margin:32px 0 8px}
.row{display:flex;align-items:center;gap:16px;min-height:56px;padding:8px 0;border-top:1px solid var(--hair);cursor:pointer;animation:in .36s var(--ease) both}
.row:first-of-type{border-top:0}
.row:hover .rt b,.row.hl .rt b{color:var(--g7)}
.num{width:24px;height:24px;border-radius:50%;display:grid;place-items:center;font-size:12px;font-weight:700;color:#fff;flex:none;font-variant-numeric:tabular-nums}
.rt{flex:1;min-width:0}.rt b{display:block;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;transition:color .15s}
.rt span{display:block;font-size:12px;line-height:16px;color:var(--mute);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.qv{display:flex;flex-direction:column;align-items:flex-end;gap:6px;flex:none;font-weight:500}
.dots{display:flex;gap:3px}.dots i{width:6px;height:6px;border-radius:50%;background:var(--hair)}.dots i.f{background:var(--g7)}
.empty{padding:24px 0;color:var(--mute);line-height:22px}
.sk{height:56px;border-top:1px solid var(--hair);background:linear-gradient(90deg,transparent,var(--fill),transparent);background-size:200% 100%;animation:sk 1.2s infinite}
@keyframes sk{to{background-position:-200% 0}}@keyframes in{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
/* botons */
.cta{width:100%;height:52px;border-radius:16px;background:var(--g9);color:var(--on);font-weight:600;font-size:15px;display:flex;align-items:center;justify-content:center;gap:8px;transition:transform .15s var(--ease)}
.cta:active{transform:scale(.98)}
.acts{display:flex;gap:8px}.acts .cta{flex:1}.sq{width:52px;height:52px;border-radius:16px;background:var(--fill);display:grid;place-items:center;flex:none}
.sq.on{color:var(--g7)}.sq.on svg{fill:currentColor}
/* fitxa de lloc */
.hero .q{font-size:40px;line-height:44px;font-weight:700;letter-spacing:-1.2px;color:var(--ink)}
.hero .sub{display:flex;align-items:center;gap:8px;margin-top:8px}
.best{display:flex;justify-content:space-between;align-items:center;margin-top:24px;padding:16px;border-radius:16px;background:var(--g2)}
.best b{font-weight:600}.best .t12{color:var(--g7)}
.spark{display:flex;gap:4px;align-items:flex-end;height:40px;margin-top:16px}.spark i{flex:1;border-radius:3px;background:var(--fill);min-height:3px;transition:height .45s var(--ease)}.spark i.b{background:var(--g7)}.spark i.t{background:var(--g4)}
.scale{margin-top:24px;font-size:12px;line-height:18px;color:var(--mute)}.scale a{color:var(--g7)}
.why{display:block;font-size:12px;color:var(--mute);line-height:16px;white-space:normal!important}
/* espècies */
.chk{width:22px;height:22px;border-radius:7px;border:1.5px solid var(--hair);display:grid;place-items:center;flex:none;transition:all .15s}
.chk.on{background:var(--g9);border-color:var(--g9);color:var(--on)}.chk svg{width:14px;height:14px;stroke-width:2.4;opacity:0}.chk.on svg{opacity:1}
.rt b .cf,.cf{display:inline-block!important;width:auto;font-size:11px;line-height:16px;color:var(--mute);border:1px solid var(--hair);border-radius:6px;padding:0 5px;margin-left:6px;font-weight:500;vertical-align:1px}
/* mode cerca */
.gpsbar{position:fixed;z-index:11;top:16px;left:50%;transform:translate(-50%,-80px);display:flex;align-items:center;gap:10px;height:44px;padding:0 16px;border-radius:14px;background:var(--paper);box-shadow:var(--shadow);font-weight:500;transition:transform .35s var(--ease)}
body.gps .gpsbar{transform:translate(-50%,0)}.gpsbar i{width:8px;height:8px;border-radius:50%;background:var(--g7);animation:ping 1.8s infinite}
@keyframes ping{0%{box-shadow:0 0 0 0 rgba(47,107,74,.5)}70%{box-shadow:0 0 0 10px transparent}100%{box-shadow:0 0 0 0 transparent}}
.here{padding:16px;border-radius:16px;background:var(--fill);margin-top:8px}.here .q{font-size:28px;line-height:32px;font-weight:700;letter-spacing:-.6px;color:var(--ink)}
.arrow{width:32px;height:32px;border-radius:50%;background:var(--g2);display:grid;place-items:center;flex:none;color:var(--g9)}
/* marcadors */
.mk{width:28px;height:28px;border-radius:50%;background:var(--c,var(--paper));color:#fff;border:2px solid var(--paper);display:grid;place-items:center;font-weight:600;font-size:13px;box-shadow:0 4px 14px rgba(0,0,0,.22);animation:pop .35s var(--ease) both;transition:transform .2s var(--ease),background .2s,color .2s}
.mkw{cursor:pointer}.mkw.hot .mk{width:26px;height:26px;font-size:12px}
.mks{position:absolute;left:21px;top:50%;transform:translateY(-50%);padding:1px 6px 1px 9px;border-radius:0 9px 9px 0;background:rgba(18,20,24,.82);color:#fff;font-size:11px;font-weight:600;font-variant-numeric:tabular-nums;z-index:-1;backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);white-space:nowrap}
.qv .sc{font-size:17px;font-weight:700;font-variant-numeric:tabular-nums;margin-right:2px}.mkw.hl .mk,.mkw:hover .mk{transform:scale(1.18)}
.mkd{display:flex;align-items:center;gap:6px;padding:4px 10px 4px 4px;border-radius:99px;background:var(--paper);box-shadow:0 4px 14px rgba(0,0,0,.22);font-weight:600;font-size:12px;cursor:pointer;animation:pop .35s var(--ease) both}
.mkd .mk{width:22px;height:22px;font-size:11px;box-shadow:none;background:var(--g9);color:var(--on)}
.me{width:18px;height:18px;border-radius:50%;background:#2F6BFF;border:3px solid #fff;box-shadow:0 0 0 8px rgba(47,107,255,.18),0 2px 8px rgba(0,0,0,.3)}
.pin{width:14px;height:14px;border-radius:50%;background:var(--ink);border:3px solid var(--paper);box-shadow:0 2px 10px rgba(0,0,0,.35)}
@keyframes pop{from{opacity:0;transform:scale(.5)}}
.maplibregl-ctrl-attrib{background:transparent!important;font-size:10px;opacity:.6}
/* ═══ mòbil */
.msearch{display:none!important}
@media (max-width:860px){
 .sheet{left:0;right:0;top:auto;bottom:0;width:auto;height:var(--sh,46vh);border-radius:24px 24px 0 0;padding-bottom:env(safe-area-inset-bottom)}
 .handle{display:block;flex:none;padding:8px 0 0;touch-action:none;cursor:grab}.handle i{display:block;width:36px;height:5px;border-radius:3px;background:var(--hair);margin:0 auto}
 .top{height:48px}.sheet .search{display:none}.days{padding-top:4px}
 .msearch{display:flex!important;position:fixed;z-index:9;top:calc(env(safe-area-inset-top) + 12px);left:12px;right:12px;background:var(--paper);box-shadow:var(--shadow)}
 body.gps .mctl{display:none}.gpsbar{top:calc(env(safe-area-inset-top) + 12px)}
}

/* ═══ Liquid Glass (blur + saturació + vora especular + reflex interior; sense refracció per compatibilitat) */
:root{--glass:rgba(255,255,255,.62);--glass-b:rgba(255,255,255,.75);--spring:cubic-bezier(.32,.72,0,1)}
@media (prefers-color-scheme:dark){:root{--glass:rgba(30,30,32,.58);--glass-b:rgba(255,255,255,.14)}}
.glass{background:var(--glass)!important;-webkit-backdrop-filter:blur(28px) saturate(1.9);backdrop-filter:blur(28px) saturate(1.9);
 border:1px solid var(--glass-b);box-shadow:inset 0 1px 0 rgba(255,255,255,.7),inset 0 -1px 0 rgba(255,255,255,.12),0 24px 60px rgba(0,0,0,.16),0 2px 6px rgba(0,0,0,.06)!important;isolation:isolate}
.mctl .ib{position:relative}
.glass::before{content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;z-index:-1;
 background:radial-gradient(120% 60% at 12% 0%,rgba(255,255,255,.55),transparent 55%),radial-gradient(80% 40% at 100% 100%,rgba(255,255,255,.18),transparent 60%)}
@media (prefers-color-scheme:dark){.glass::before{background:radial-gradient(120% 60% at 12% 0%,rgba(255,255,255,.12),transparent 55%)}}
.sheet.glass{animation:sheetIn .7s var(--spring) both}
@keyframes sheetIn{from{opacity:0;transform:translateY(24px) scale(.98)}to{opacity:1;transform:none}}
@media (max-width:860px){@keyframes sheetIn{from{opacity:0;transform:translateY(60px)}to{opacity:1;transform:none}}}
.scr{transition:opacity .38s var(--spring),transform .5s var(--spring)!important}
.day{background:rgba(118,118,128,.1);transition:color .3s var(--spring)}
.day.on{background:transparent!important;color:var(--on)}
.thumb{position:absolute;top:16px;left:0;height:34px;border-radius:12px;background:var(--g9);transition:transform .45s var(--spring),width .45s var(--spring);z-index:0;pointer-events:none}
.days{position:relative}.day{z-index:1}
.mkw .mk{animation:drop .55s var(--spring) both}
@keyframes drop{0%{opacity:0;transform:translateY(-18px) scale(.6)}60%{opacity:1;transform:translateY(2px) scale(1.06)}100%{transform:none}}
.cta{transition:transform .25s var(--spring),box-shadow .25s}.cta:hover{box-shadow:0 8px 24px rgba(0,0,0,.18)}
.row{transition:background .2s,transform .3s var(--spring)}.row:active{transform:scale(.99)}
.m3d{height:220px;margin:0 -24px 8px;position:relative;cursor:grab;touch-action:none}
.m3d canvas{display:block;width:100%!important;height:100%!important}
.m3d::after{content:"Arrossega per girar";position:absolute;bottom:8px;left:0;right:0;text-align:center;font-size:12px;color:var(--mute)}

/* ═══ estil Apple Maps (HIG): cerca al full, controls de mapa en vidre, escala tipogràfica iOS */
.top2{display:flex;align-items:center;gap:10px;padding:16px 16px 8px;flex:none}.top2 .search{flex:1;height:40px;border-radius:12px;padding:0 12px}
.ib.round{width:40px;height:40px;border-radius:50%;background:var(--fill)}
.demo{display:none;font-size:13px;line-height:18px;color:var(--g7);margin:4px 0 0}
.mctl{position:fixed;z-index:9;top:16px;right:16px;display:flex;flex-direction:column;gap:8px}body.gps .mctl{display:none}
.mctl .ib{width:44px;height:44px;border-radius:12px;color:var(--ink)}.mctl .ib.on{color:var(--g7)}
.t28{font-size:22px!important;line-height:28px!important;font-weight:700!important;letter-spacing:-.4px!important}
.rt b{font-size:15px}.day{height:34px;font-size:15px}
@media (max-width:860px){html,body{font-size:17px;line-height:22px}.rt b{font-size:17px}.top2{padding:8px 16px}.mctl{top:calc(env(safe-area-inset-top) + 12px);right:12px}
 .sheet .search{display:flex!important}.msearch{display:none!important}
 .fams{flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none;margin-right:-24px;padding-right:24px}.fams::-webkit-scrollbar{display:none}}

/* ═══ sortides: registre amb esforç explícit (interruptor, estat, troballa, resum, els meus llocs) */
.trrow{display:flex;align-items:center;gap:16px;min-height:56px;margin:-8px 0 8px;cursor:pointer}
.sw{position:relative;width:51px;height:31px;border-radius:16px;background:var(--fill);flex:none;transition:background .25s var(--spring)}
.sw::after{content:"";position:absolute;top:2px;left:2px;width:27px;height:27px;border-radius:50%;background:#fff;box-shadow:0 3px 8px rgba(0,0,0,.15),0 1px 1px rgba(0,0,0,.16);transition:transform .3s var(--spring)}
.sw.on{background:var(--g7)}.sw.on::after{transform:translateX(20px)}
.trst{display:flex;align-items:center;gap:8px;height:20px;margin-bottom:12px;font-size:13px;color:var(--mute);font-variant-numeric:tabular-nums;white-space:nowrap}
.trst span:first-of-type{overflow:hidden;text-overflow:ellipsis}.trst i{width:8px;height:8px;border-radius:50%;background:var(--g7);flex:none;animation:ping 1.8s infinite}.trst .r{margin-left:auto}
.cta.fl{background:var(--fill);color:var(--ink)}.cta:disabled{opacity:.4;cursor:default;box-shadow:none}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:16px}.chips .pill{padding:0 14px;transition:background .2s,color .2s}.chips .pill.on{background:var(--g9);color:var(--on)}
.stp{display:flex;align-items:center;gap:8px}.stp b{min-width:36px;text-align:center;font-size:22px;font-weight:700;font-variant-numeric:tabular-nums}.stp .sq{width:40px;height:40px;border-radius:12px}
#fFoto{cursor:pointer;background-size:cover;background-position:center}#fFoto.ph svg{display:none}
.trn{display:block;width:100%;height:48px;margin-top:16px;padding:0 16px;border:0;border-radius:16px;background:var(--fill);outline:none;font-size:15px}.trn::placeholder{color:var(--mute)}
.myk{display:block;width:12px;height:12px;border-radius:50%;background:var(--paper);border:3px solid var(--g9);box-shadow:0 1px 6px rgba(0,0,0,.35);animation:pop .35s var(--ease) both}
.myk.n{background:var(--g7);border-color:var(--paper)}.myk.z{width:10px;height:10px;border:2px solid var(--mute)}
.mykb{width:24px;display:grid;place-items:center;flex:none}
/* ═══ /sortides */
/* ═══ cercar bolets */
.wzdots{display:flex;gap:6px}.wzdots i{width:18px;height:4px;border-radius:2px;background:var(--hair);transition:background .3s}.wzdots i.on{background:var(--g9)}
.wzp{margin-top:8px;line-height:22px;color:var(--mute)}
.wzopt{display:flex;align-items:center;gap:14px;padding:14px 16px;margin-top:10px;border-radius:16px;background:var(--fill);cursor:pointer;transition:background .2s,transform .25s var(--spring)}
.wzopt:active{transform:scale(.98)}.wzopt.on{background:var(--g9);color:var(--on)}.wzopt.on span{color:inherit;opacity:.75}
.wzopt div{display:flex;flex-direction:column;gap:2px}.wzopt b{font-weight:600}.wzopt span{font-size:13px;color:var(--mute)}
.wzs{margin-top:16px;position:relative}
.chips .pill .cd{width:8px;height:8px;border-radius:50%;margin-right:2px}
.wzz{padding:16px 0;border-top:1px solid var(--hair);animation:in .36s var(--ease) both}
.wzh{display:flex;align-items:center;gap:12px}.wzh .rt{flex:1;min-width:0}.wzh .rt b{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.wzh .rt span{font-size:13px;color:var(--mute)}
.wzn{display:flex;flex-direction:column;align-items:flex-end}.wzn b{font-size:24px;font-weight:700;font-variant-numeric:tabular-nums;line-height:1}.wzn span{font-size:12px;color:var(--mute);margin-top:2px}
.wzd{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:12px}.wzd div{display:flex;flex-direction:column;gap:2px;padding:10px 12px;border-radius:12px;background:var(--fill)}.wzd b{font-size:14px}
.wzwhy{margin-top:10px;font-size:13px;line-height:19px;color:var(--mute)}
.wzz .acts .cta{height:44px;font-size:14px;text-decoration:none}
/* ═══ actualitzar (a demanda) */
.upd{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-top:10px;font-size:12px;color:var(--mute);min-height:28px}
.upd button{height:28px;padding:0 12px;border-radius:9px;background:var(--fill);color:var(--ink);font-weight:600;font-size:12px;display:inline-flex;align-items:center;gap:6px}

<body>

 </div>

<script>
const $=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)];
const ICGC='https://geoserveis.icgc.cat/servei/catalunya/mapa-base/wmts/',DEM='https://geoserveis.icgc.cat/servei/catalunya/contextmaps-terreny-5m-rgb/wmts/{z}/{x}/{y}.png';
const MES=['gener','febrer','març','abril','maig','juny','juliol','agost','setembre','octubre','novembre','desembre'],DA=['Dg','Dl','Dt','Dc','Dj','Dv','Ds'],DL=['diumenge','dilluns','dimarts','dimecres','dijous','divendres','dissabte'];
const lg=s=>(s||'').replace(/l·l/g,'ŀl').replace(/L·L/g,'ĿL'),cap=s=>s?s.charAt(0).toUpperCase()+s.slice(1):s;
const QW=[[80,'Exceŀlent'],[60,'Bona'],[40,'Possible'],[20,'Baixa'],[0,'Nuŀla']],qw=v=>QW.find(q=>v>=q[0])[1],ql=v=>v<1?0:Math.min(5,Math.floor(v/20)+1);
const dots=(v,c)=>`<span class="dots">${[1,2,3,4,5].map(k=>`<i class="${k<=ql(v)?'f':''}" style="${k<=ql(v)&&c?'background:'+c:''}"></i>`).join('')}</span>`;
const store={get(k,d){try{return JSON.parse(localStorage.getItem(k))??d}catch(e){return d}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}};
const Dt=d=>new Date(d+'T12:00:00'),add=(d,n)=>{const x=Dt(d);x.setDate(x.getDate()+n);return x.toISOString().slice(0,10)},mob=()=>innerWidth<=860;
const S={m:null,day:null,end:null,today:null,days:[],sel:new Set(store.get('sel',[])),pt:null,zone:null,zones:[],marks:[],gps:null,me:null,watch:null,near:[],nmarks:[],scr:'home',prev:'home'};
const spOf=id=>S.m.especies.find(s=>s.id===id)||{nom:id},filtreQ=()=>S.sel.size?'&filtre='+[...S.sel].join(','):'';

/* ═══ mapa: cartogràfic de lluny → ortofoto de prop (automàtic) */
const map=new maplibregl.Map({container:'map',center:[1.72,41.8],zoom:7.6,minZoom:6.8,maxZoom:18,hash:true,attributionControl:{compact:true},
 maxBounds:[[-0.8,39.9],[4.4,43.3]],maxPitch:72,
 style:{version:8,sources:{topo:{type:'raster',tiles:[ICGC+'topografic/MON3857NW/{z}/{x}/{y}.png'],tileSize:256,maxzoom:19,attribution:'© ICGC'},
  orto:{type:'raster',tiles:[ICGC+'orto/MON3857NW/{z}/{x}/{y}.png'],tileSize:256,maxzoom:19,attribution:'© ICGC'},hs:{type:'raster-dem',tiles:[DEM],tileSize:512,maxzoom:14}},
  layers:[{id:'bg',type:'background',paint:{'background-color':'#F5F5F7'}},
   {id:'topo',type:'raster',source:'topo',paint:{'raster-saturation':-1,'raster-brightness-min':0.22,'raster-contrast':-0.25,'raster-opacity':['interpolate',['linear'],['zoom'],12,0.9,14,0]}},
   {id:'orto',type:'raster',source:'orto',paint:{'raster-saturation':-0.35,'raster-brightness-max':0.92,'raster-opacity':['interpolate',['linear'],['zoom'],12,0,14,1]}},
   {id:'hill',type:'hillshade',source:'hs',paint:{'hillshade-exaggeration':['interpolate',['linear'],['zoom'],8,0.32,14,0.12],'hillshade-shadow-color':'#33402F','hillshade-highlight-color':'#FFFFFF','hillshade-accent-color':'#55604C'}}]}});
map.touchZoomRotate.disableRotation();
let ready=false;const ti=()=>{if(ready)return;if(map.isStyleLoaded()||(map.style&&map.style._loaded)){ready=true;init()}else setTimeout(ti,300)};map.on('style.load',ti);map.on('styledata',ti);map.on('load',ti);setTimeout(ti,400);
map.on('error',e=>{if(!/dem dimension/.test(String(e&&e.error&&e.error.message)))console.warn(e&&e.error)});   /* una tesela de relleu dolenta no ha d'aturar l'app */
const dark=matchMedia('(prefers-color-scheme: dark)');
function theme(){if(!map.getLayer('bg'))return;const d=false;   /* mapa sempre clar (decisió del propietari 16/10) */map.setPaintProperty('bg','background-color',d?'#000000':'#F5F5F7');
 map.setPaintProperty('topo','raster-brightness-min',d?0:0.22);map.setPaintProperty('topo','raster-brightness-max',d?0.32:1);map.setPaintProperty('hill','hillshade-highlight-color',d?'#2A3329':'#FFFFFF')}
dark.addEventListener('change',theme);

async function init(){
 S.m=await (await fetch('/api/v4/meta')).json();S.end=S.m.analisi[1];{const n=new Date(),t=`${n.getFullYear()}-${String(n.getMonth()+1).padStart(2,'0')}-${String(n.getDate()).padStart(2,'0')}`;S.today=t>S.end?t:add(S.end,1)}
 {const a0=add(S.end,-7),t7=add(S.today,-7),z=S.m.previsio_fins||(S.m.previsio?add(S.end,14):S.end);let d=t7>a0?t7:a0;while(d<=z&&S.days.length<40){S.days.push(d);d=add(d,1)}}
 $('#demo').style.display=S.m.demo?'block':'none';theme();
 S.day=S.m.previsio&&S.days.includes(S.today)?S.today:S.days.at(-1);if(S.sel.size>=S.m.especies.length){S.sel.clear();store.set('sel',[])}
 map.addSource('radar',{type:'raster',tiles:[tileURL()],tileSize:256,maxzoom:14});
 map.addLayer({id:'radar',type:'raster',source:'radar',maxzoom:16,paint:{'raster-opacity':['interpolate',['linear'],['zoom'],8,0.92,13,0.85,14.6,0.7,15.6,0],'raster-fade-duration':260,'raster-resampling':'nearest'}},'hill');
 map.addSource('prec',{type:'raster',tiles:[precURL()],tileSize:256,minzoom:15,maxzoom:16});
 map.addLayer({id:'prec',type:'raster',source:'prec',minzoom:14.6,paint:{'raster-opacity':['interpolate',['linear'],['zoom'],14.6,0,15.4,1],'raster-fade-duration':180,'raster-resampling':'linear'}},'hill');
 map.on('click',e=>{if(!e.originalEvent.target.closest('.mkw,.mkd'))openPlace(e.lngLat.lng,e.lngLat.lat)});
 map.on('moveend',()=>{warm();if(S.scr==='home'||map.getZoom()>=15)loadZones();if(S.gps&&S.gps.sim)loadNear()});
 buildDays();setLabel();renderInfo();if(mob())sheet(1);setPad();setDay(S.day);
}
/* ═══ pantalles del full */
function go(name,back){const cur=$('.scr.on')||$('#s-'+S.scr)||$('#s-home'),nx=$('#s-'+name);if(cur===nx||!nx)return;if(name==='info')S.prev=S.scr;S.scr=name;
 cur.classList.remove('on');cur.classList.toggle('back',!back);nx.classList.remove('back');requestAnimationFrame(()=>nx.classList.add('on'));
 if(name==='species')renderSpecies();if(name==='home'){if(typeof wzClear==='function')wzClear();refreshTiles();loadZones()}if(mob()&&name!=='home'&&cur_<1)sheet(1)}
/* ═══ dies */
const dlabel=d=>{const k=Math.round((Dt(d)-Dt(S.today))/864e5),x=Dt(d);return k===0?'Avui':k===1?'Demà':k===-1?'Ahir':`${DA[x.getDay()]} ${x.getDate()}`};
const dayText=d=>{const x=Dt(d);return `${cap(DL[x.getDay()])} ${x.getDate()} ${/^[aeiouà]/.test(MES[x.getMonth()])?"d'":'de '}${MES[x.getMonth()]}`};
function buildDays(){$('#days').innerHTML='<i class="thumb" id="thumb"></i>'+S.days.map(d=>`<button class="day${d<S.today?' past':''}" data-d="${d}">${dlabel(d)}</button>`).join('');$$('.day').forEach(b=>b.onclick=()=>setDay(b.dataset.d))}
function moveThumb(){const on=$('.day.on'),th=$('#thumb'),c=$('#days');if(!on||!th)return;const x=on.getBoundingClientRect().left-c.getBoundingClientRect().left+c.scrollLeft;th.style.width=on.offsetWidth+'px';th.style.height=on.offsetHeight+'px';th.style.top=on.offsetTop+'px';th.style.transform=`translateX(${x}px)`}
function setDay(d){S.day=d;$$('.day').forEach(b=>b.classList.toggle('on',b.dataset.d===d));moveThumb();setTimeout(moveThumb,350);const on=$('.day.on'),c=$('#days');if(on)c.scrollTo({left:on.offsetLeft-c.clientWidth/2+on.clientWidth/2,behavior:'smooth'});
 refreshTiles();if(S.scr==='home')loadZones();if(S.scr==='place'&&S.pt)openPlace(S.pt[0],S.pt[1],S.zone,true);if(S.gps)loadNear()}
/* ═══ capa del radar */
function tileURL(){return `rtile://tiles4/totes/${S.day}/{z}/{x}/{y}.png?v=${S.m.versio||2}${filtreQ()}`}
function precURL(){return `rtile://tilesp/totes/${S.day}/{z}/{x}/{y}.png?v=q${S.m.versio||3}${filtreQ()}`}
function refreshTiles(){map.getSource('radar')&&map.getSource('radar').setTiles([tileURL()]);map.getSource('prec')&&map.getSource('prec').setTiles([precURL()])}
/* ═══ zona visible del mapa */
function vis(){const W=innerWidth,H=innerHeight;let x0=0,y0=0,x1=W,y1=H;
 if(mob()){x1=W-64;y0=12;y1=H-$('#sheet').getBoundingClientRect().height-12}else{x0=$('#sheet').getBoundingClientRect().right+16}
 return {x0,y0,x1,y1:Math.max(y1,y0+40)}}
function setPad(){const v=vis();map.setPadding({left:v.x0,top:v.y0,right:innerWidth-v.x1,bottom:innerHeight-v.y1})}
function vb(){const v=vis(),m=28,a=map.unproject([v.x0+m,v.y1-m]),b=map.unproject([v.x1-m,v.y0+m]);return `w=${a.lng}&s=${a.lat}&e=${b.lng}&n=${b.lat}`}
/* ═══ millors llocs */
let wt;function warm(){clearTimeout(wt);wt=setTimeout(()=>{if(map.getZoom()>=12.5)fetch(`/api/v4/warm?date=${S.day}&${vb()}${filtreQ()}`).catch(()=>{})},120)}
function clearMarks(a){a.forEach(m=>m.remove());a.length=0}
const J=async u=>{try{const r=await fetch(u);return r.ok?await r.json():{}}catch(e){return {}}};
const dist=(a,b,c,d)=>{const R=6371e3,t=Math.PI/180,x=(c-a)*t*Math.cos((b+d)/2*t),y=(d-b)*t;return Math.hypot(x,y)*R};
let zt,zq=0;function loadZones(){clearTimeout(zt);zt=setTimeout(async()=>{const id=++zq;if(!S.zones.length)$('#zones').innerHTML='<div class="sk"></div><div class="sk"></div><div class="sk"></div>';
 const close=map.getZoom()>=15;
 const r=close?await J(`/api/v4/spots?date=${S.day}&${vb()}${filtreQ()}&k=10`):await J(`/api/v4/top?sp=totes&date=${S.day}&${vb()}${filtreQ()}&k=5`);
 if(id!==zq)return;if(S.scr!=='home'){if(close){S.hot=(r.punts||[]);drawHot()}return}
 if(close){const c=map.getCenter();S.zones=(r.punts||[]).map(p=>({...p,lloc:`A ${Math.round(dist(c.lng,c.lat,p.lon,p.lat))} m del centre`,municipi:p.arbre_m!=null?(p.arbre_m<1?'tocant a un arbre':`a ${Math.round(p.arbre_m)} m d’un arbre`):''}))}else S.zones=r.zones||[];
 $('#s-home .sec .t17').textContent=close?'Millors punts':'Millors llocs';
 $('#zctx').textContent=`${dlabel(S.day).toLowerCase()} · ${close?'zones de 25 m · sense validar':'a la vista'}`;
 $('#zones').innerHTML=S.zones.length?S.zones.map((z,i)=>`<div class="row" data-i="${i}" style="animation-delay:${i*40}ms"><span class="num" style="background:${spOf(z.especie).color}">${i+1}</span>
  <div class="rt"><b>${lg(z.lloc)||'Lloc sense nom'}</b><span>${cap(spOf(z.especie).nom)}${z.municipi&&!(z.lloc||'').includes(z.municipi)?' · '+lg(z.municipi):''}</span></div>
  <div class="qv">${close?`<b class="sc">${Math.round(z.index)}</b>`:''}${qw(z.index)}${dots(z.index,spOf(z.especie).color)}</div></div>`).join('')
  :`<div class="empty">${close?'Cap punt d’aquesta vista arriba a 45/100 aquest dia. Prova un altre dia o mou el mapa.':'Aquí no hi ha cap lloc amb condicions possibles aquest dia. Allunya el mapa o prova un altre dia.'}</div>`;
 $$('#zones .row').forEach(el=>{const i=+el.dataset.i;el.onclick=()=>openZone(i);el.onmouseenter=()=>hl(i,1);el.onmouseleave=()=>hl(i,0)});S.hot=close?S.zones:[];drawZones()},260)}
function drawZones(){clearMarks(S.marks);S.zones.forEach((z,i)=>{const el=document.createElement('div');el.className='mkw'+(map.getZoom()>=15?' hot':'');el.innerHTML=`<div class="mk" style="animation-delay:${i*50}ms;--c:${spOf(z.especie).color}">${i+1}</div>${map.getZoom()>=15?`<span class="mks">${Math.round(z.index)}</span>`:''}`;
 el.onclick=e=>{e.stopPropagation();openZone(i)};el.onmouseenter=()=>hl(i,1);el.onmouseleave=()=>hl(i,0);S.marks.push(new maplibregl.Marker({element:el}).setLngLat([z.lon,z.lat]).addTo(map))})}
function drawHot(){clearMarks(S.marks);(S.hot||[]).forEach((z,i)=>{const el=document.createElement('div');el.className='mkw hot';el.innerHTML=`<div class="mk" style="--c:${spOf(z.especie).color}">${i+1}</div><span class="mks">${Math.round(z.index)}</span>`;
 el.onclick=e=>{e.stopPropagation();S.zones=S.hot;openZone(i)};S.marks.push(new maplibregl.Marker({element:el}).setLngLat([z.lon,z.lat]).addTo(map))})}
function hl(i,on){S.marks[i]?.getElement().classList.toggle('hl',!!on);$$('#zones .row')[i]?.classList.toggle('hl',!!on)}
function openZone(i){const z=S.zones[i];map.flyTo({center:[z.lon,z.lat],zoom:Math.max(map.getZoom(),14),speed:1.2,essential:true});openPlace(z.lon,z.lat,z)}
/* ═══ fitxa del lloc */
let pin;async function openPlace(lon,lat,zone,keep){if(S.gps)return;S.pt=[lon,lat];S.zone=zone||null;
 if(pin)pin.remove();const el=document.createElement('div');el.className='pin';pin=new maplibregl.Marker({element:el}).setLngLat([lon,lat]).addTo(map);
 if(!keep){if(map.getZoom()<15)clearMarks(S.marks);go('place');$('#pBody').innerHTML='<div class="sk" style="margin-top:8px"></div><div class="sk"></div><div class="sk"></div>'}
 $('#pDay').textContent=dlabel(S.day);
 const r=await J(`/api/v4/point?lon=${lon}&lat=${lat}&date=${S.day}`);if(S.scr!=='place')return;
 const L=(r.especies||[]).filter(e=>!S.sel.size||S.sel.has(e.id));
 const full=zone&&zone.lloc?lg(zone.lloc):'',title=full?full.split(',')[0]:'Punt seleccionat',muni=full.includes(',')?full.split(',').slice(1).join(',').trim():(zone&&zone.municipi?lg(zone.municipi):'');

 $$('#wzBody [data-k]').forEach(b=>b.onclick=()=>{WZ.km=+b.dataset.k;store.set('wzKm',WZ.km);wzRender()});
 $$('#wzBody [data-g]').forEach(b=>b.onclick=()=>{const g=b.dataset.g;WZ.fams.has(g)?WZ.fams.delete(g):WZ.fams.add(g);store.set('wzFams',[...WZ.fams]);wzRender()});
 $$('#wzBody [data-w]').forEach(b=>b.onclick=()=>{WZ.when=b.dataset.w;wzRender()});
 $('#wzNext').onclick=()=>{if(s===0&&!WZ.from)return;if(s<3){WZ.step++;wzRender()}else wzRun()}}
function wzSearch(){const inp=$('#wzQ'),box=$('#wzSug');let t,R=[];
 inp.oninput=()=>{clearTimeout(t);const v=inp.value.trim();if(v.length<3){box.style.display='none';return}
  t=setTimeout(async()=>{try{R=(await (await fetch('/api/search?q='+encodeURIComponent(v))).json()).results||[]}catch(e){R=[]}
   box.innerHTML=R.map((x,i)=>`<div data-i="${i}"><span>${lg(x.name)}</span><span class="t12">${x.comarca||''}</span></div>`).join('');box.style.display=R.length?'block':'none';
   box.querySelectorAll('div').forEach(d=>d.onmousedown=e=>{e.preventDefault();const x=R[+d.dataset.i];WZ.from={lon:x.lon,lat:x.lat,n:x.name};WZ.step=1;wzRender()})},200)};
 inp.onblur=()=>setTimeout(()=>box.style.display='none',150)}
function wzSp(){if(!WZ.fams.size)return'totes';return S.m.especies.filter(e=>WZ.fams.has(e.grup)).map(e=>e.id).join(',')}
function wzClear(){WZ.marks.forEach(m=>m.remove());WZ.marks=[]}
async function wzRun(){go('wres');const fams=WZ.fams.size?S.m.grups.filter(g=>WZ.fams.has(g.id)).map(g=>g.nom.toLowerCase()).join(', '):'tots els bolets de bosc';
 $('#wrCtx').textContent=`${WZ.km} km · ${fams}`;$('#wrBody').innerHTML='<div class="t28">Buscant zones…</div><div class="sk" style="margin-top:16px"></div><div class="sk"></div><div class="sk"></div>';
 let r;try{r=await (await fetch(`/api/v4/cerca?lon=${WZ.from.lon}&lat=${WZ.from.lat}&km=${WZ.km}&sp=${wzSp()}&dies=${wzDays().join(',')}`)).json()}catch(e){r={zones:[],motiu:'No s’ha pogut connectar amb el servidor.'}}
 wzClear();WZ.res=r;
 if(!r.zones||!r.zones.length){
  $('#wrBody').innerHTML=`<div class="t28">Ara no val la pena</div><p class="m wzp">${r.motiu||'No hi ha cap zona bona.'}</p>
   ${r.fora?`<div class="best" style="background:var(--fill)"><div><div class="t12">La zona bona més propera</div><b>a ${Math.round(r.fora.km)} km · ${dayText(r.fora.dia)}</b></div><span style="font-weight:600">${qw(r.fora.nota)}</span></div>
   <div class="acts" style="margin-top:16px"><button class="cta" id="wrFar">Ampliar a ${Math.ceil(r.fora.km/10)*10} km</button></div>`:''}
   <p class="scale" style="margin-top:24px">Només et recomanem zones amb condicions bones de veritat (60 o més sobre 100). Prova un altre dia o una distància més gran.</p>`;
  if(r.fora)$('#wrFar').onclick=()=>{WZ.km=Math.ceil(r.fora.km/10)*10;wzRun()};return}
 const b=new maplibregl.LngLatBounds([WZ.from.lon,WZ.from.lat],[WZ.from.lon,WZ.from.lat]);
 r.zones.forEach((z,i)=>{b.extend([z.lon,z.lat]);const el=document.createElement('div');el.className='mkw';el.innerHTML=`<div class="mk" style="--c:${spOf(z.especie).color}">${i+1}</div>`;
  el.onclick=e=>{e.stopPropagation();wzShow(i)};WZ.marks.push(new maplibregl.Marker({element:el}).setLngLat([z.lon,z.lat]).addTo(map))});
 const me=document.createElement('div');me.className='pin';WZ.marks.push(new maplibregl.Marker({element:me}).setLngLat([WZ.from.lon,WZ.from.lat]).addTo(map));
 map.fitBounds(b,{padding:60,maxZoom:12,duration:900});
 $('#wrBody').innerHTML=`<div class="t28">${r.zones.length===1?'Una zona bona':r.zones.length+' zones bones'}</div><p class="m wzp">Ordenades de millor a pitjor. Totes superen 60 sobre 100.</p>`+
  r.zones.map((z,i)=>{const sp=spOf(z.especie),nm=lg(z.lloc||'Zona sense nom').split(',')[0],mu=lg(z.municipi||z.comarca||'');
   return `<div class="wzz" data-i="${i}" style="animation-delay:${i*50}ms"><div class="wzh"><span class="num" style="background:${sp.color}">${i+1}</span><div class="rt"><b>${nm}</b><span>${mu}${mu?' · ':''}${Math.round(z.km)} km · ~${z.cotxe_min} min</span></div><div class="wzn"><b>${Math.round(z.nota)}</b><span>${qw(z.nota)}</span></div></div>
    <div class="wzd"><div><span class="t12">Millor dia</span><b>${dayText(z.dia)}</b></div><div><span class="t12">Surt d’hora</span><b>Sol a les ${z.sol}</b></div></div>
    <p class="m wzwhy">${cap(sp.nom)} · ${z.hoste} · ${z.altitud} m · orientació ${z.orientacio} · bosc de ~${z.edat_bosc} anys · el ${z.bosc_bo} % de la zona és bon bosc per a aquest bolet.${z.cap_de_setmana?' Cap de setmana: hi pot haver més gent, arriba-hi aviat.':''}</p>
    <div class="spark">${z.serie.map((v,k)=>`<i class="${r.dies[k]===z.dia?'b':''}" style="height:${Math.max(3,v/100*40)}px"></i>`).join('')}</div>
    <div class="acts" style="margin-top:12px"><button class="cta fl" data-a="map">Veure-la</button><a class="cta fl" target="_blank" rel="noopener" href="https://www.google.com/maps/dir/?api=1&destination=${z.lat},${z.lon}">Com arribar-hi</a><button class="cta" data-a="go">Buscar aquí</button></div></div>`}).join('')+
  `<p class="scale" style="margin-top:24px">Nota absoluta del motor (100 = de les millors condicions en 17 anys). Indica condicions, no garanteix trobar bolets: algú hi pot haver passat abans. Respecta la propietat i la normativa.</p>`;
 $$('#wrBody .wzz').forEach(c=>{const i=+c.dataset.i;c.querySelector('[data-a=map]').onclick=()=>wzShow(i);c.querySelector('[data-a=go]').onclick=()=>{const z=r.zones[i];wzClear();setDay(z.dia);startGPS([z.lon,z.lat])}})}
function wzShow(i){const z=WZ.res.zones[i];setDay(z.dia);map.flyTo({center:[z.lon,z.lat],zoom:15.2,speed:1.3,essential:true})}
/* ═══ actualitzar: només quan l'usuari ho demana (cap procés automàtic) */
let updT;async function updStatus(){let r;try{r=await (await fetch('/api/v4/actualitzacio')).json()}catch(e){clearTimeout(updT);updT=setTimeout(updStatus,15000);return}
 const el=$('#upd');if(!el)return;const obs=r.observat_fins?dlabel(r.observat_fins).toLowerCase():'—';
 if(r.en_curs){el.innerHTML=`<span><i class="spin"></i>Actualitzant amb les dades d’avui…</span><span class="t12">pot trigar uns minuts</span>`;clearTimeout(updT);updT=setTimeout(updStatus,15000);S.updRun=true;return}
 if(S.updRun){S.updRun=false;location.reload();return}
 el.innerHTML=`<span>${r.error?'L’última actualització ha fallat · ':''}Dades reals fins ${obs==='ahir'?'ahir':'al '+obs}</span>`+
  (r.bloquejat?'<span class="t12">per actualitzar, fes-ho a l’ordinador</span>':`<button class="${r.al_dia?'':'hot'}" id="updGo">Actualitzar</button>`);
 const b=$('#updGo');if(b)b.onclick=async()=>{b.disabled=true;let ok=false;try{const q=await (await fetch('/api/v4/actualitzacio',{method:'POST'})).json();ok=!!(q.comencada||q.en_curs)}catch(e){}S.updRun=ok;updStatus()}}
setTimeout(updStatus,1200);
</script>
